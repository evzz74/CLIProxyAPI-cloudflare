name: Deploy CLIProxyAPI to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliproxy-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Check Docker
        run: docker version

      - name: Deploy Worker and Container
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          command: deploy
          secrets: |
            OBJECTSTORE_ENDPOINT
            OBJECTSTORE_ACCESS_KEY
            OBJECTSTORE_SECRET_KEY
            OBJECTSTORE_BUCKET
            MANAGEMENT_PASSWORD
        env:
          OBJECTSTORE_ENDPOINT: ${{ secrets.OBJECTSTORE_ENDPOINT }}
          OBJECTSTORE_ACCESS_KEY: ${{ secrets.OBJECTSTORE_ACCESS_KEY }}
          OBJECTSTORE_SECRET_KEY: ${{ secrets.OBJECTSTORE_SECRET_KEY }}
          OBJECTSTORE_BUCKET: ${{ secrets.OBJECTSTORE_BUCKET }}
          MANAGEMENT_PASSWORD: ${{ secrets.MANAGEMENT_PASSWORD }}
