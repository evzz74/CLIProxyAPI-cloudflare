name: Test Cloudflare Authentication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Check secrets exist
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ERROR: CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi

          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ERROR: CLOUDFLARE_ACCOUNT_ID is empty"
            exit 1
          fi

          echo "API token is configured"
          echo "Account ID is configured"
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"

      - name: Verify API token itself
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          echo "$RESPONSE" | jq '{
            success: .success,
            status: .result.status,
            errors: .errors,
            messages: .messages
          }'

          echo "$RESPONSE" | jq -e \
            '.success == true and .result.status == "active"'

      - name: Verify account and Workers access
        shell: bash
        run: |
          RESPONSE=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          echo "$RESPONSE" | jq '{
            success: .success,
            errors: .errors,
            result: .result
          }'

          echo "$RESPONSE" | jq -e '.success == true'
